name: build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          set -euxo pipefail
          brew list ldid >/dev/null 2>&1 || brew install ldid
          brew list dpkg >/dev/null 2>&1 || brew install dpkg

      - name: Check jailbreak-neutral runtime files
        run: sh scripts/check-jailbreak.sh

      - name: Build rootless .deb
        run: sh scripts/build.sh 2026.10.3

      - name: Verify Mach-O and signature
        run: |
          set -euxo pipefail
          node scripts/verify-macho.mjs build/cloudflared.ios
          ldid -e build/cloudflared.ios
          ldid -e build/cloudflared.ios | grep -q platform-application

      - name: Smoke-test package without installing it
        run: sh scripts/test-package.sh dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: cloudflared-ios
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cloudflared-ios
          path: dist

      - name: Create GitHub Release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving its assets unchanged"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
